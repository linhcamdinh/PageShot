<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pageshot</title>
  <link rel="icon" href="../icons/icon32.png">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="topbar">
    <div class="title">
      <img src="../icons/icon32.png" alt="" width="20" height="20">
      <strong>Pageshot</strong>
      <span id="meta"></span>
    </div>
    <div class="actions">
      <button id="undo" class="icon" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="redo" class="icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
      </button>
      <span class="sep"></span>
      <button id="zoom-out" class="icon" title="Zoom out (Ctrl+-)" aria-label="Zoom out">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8 11h6"/></svg>
      </button>
      <button id="zoom-label" class="zoom" title="Fit to window (Ctrl+0)">100%</button>
      <button id="zoom-in" class="icon" title="Zoom in (Ctrl+=)" aria-label="Zoom in">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8 11h6M11 8v6"/></svg>
      </button>
      <span class="sep"></span>
      <div class="segmented" role="radiogroup" aria-label="File format">
        <button data-format="png" role="radio" aria-checked="true">PNG</button>
        <button data-format="jpeg" role="radio" aria-checked="false">JPEG</button>
      </div>
      <label class="quality" id="quality-ctl" title="JPEG quality: lower makes smaller files" hidden>
        Quality
        <input type="range" id="quality" min="40" max="100" step="1" value="92">
        <output id="quality-value">92</output>
      </label>
      <div class="menu-wrap">
        <button id="save-settings" class="icon" title="Save options" aria-label="Save options" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <div class="menu" id="save-menu" hidden>
          <label class="check">
            <input type="checkbox" id="ask-location" checked>
            Ask where to save each time
          </label>
          <label class="field" id="folder-field">
            Folder inside Downloads
            <input type="text" id="folder" value="Pageshot" placeholder="Leave empty for Downloads">
          </label>
          <label class="field">
            File name
            <input type="text" id="filename" spellcheck="false">
          </label>
          <p class="hint">Copy always uses PNG, since that is the format the clipboard accepts.</p>
        </div>
      </div>
      <button id="copy">Copy</button>
      <button id="save" class="primary">Save</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tools" role="toolbar" aria-label="Tools">
      <button class="tool" data-tool="select" title="Select and move (V)" aria-label="Select">
        <svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg>
      </button>
      <button class="tool" data-tool="arrow" title="Arrow (A)" aria-label="Arrow">
        <svg viewBox="0 0 24 24"><path d="M5 19 19 5M10 5h9v9"/></svg>
      </button>
      <button class="tool" data-tool="line" title="Line (L)" aria-label="Line">
        <svg viewBox="0 0 24 24"><path d="M5 19 19 5"/></svg>
      </button>
      <button class="tool" data-tool="rect" title="Rectangle (R)" aria-label="Rectangle">
        <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
      </button>
      <button class="tool" data-tool="ellipse" title="Ellipse (O)" aria-label="Ellipse">
        <svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5"/></svg>
      </button>
      <button class="tool" data-tool="pen" title="Pen (P)" aria-label="Pen">
        <svg viewBox="0 0 24 24"><path d="M4 20c3-1 4-6 7-6s2 4 5 4 3-5 4-7"/></svg>
      </button>
      <button class="tool" data-tool="highlighter" title="Highlighter (H)" aria-label="Highlighter">
        <svg viewBox="0 0 24 24"><path d="m9 15 7.5-7.5a2 2 0 0 0-3-3L6 12l-1 4z"/><path d="M4 20h7"/></svg>
      </button>
      <button class="tool" data-tool="text" title="Text (T)" aria-label="Text">
        <svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>
      </button>
      <button class="tool" data-tool="step" title="Numbered step (N)" aria-label="Numbered step">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M11 9l1.5-1v8"/></svg>
      </button>
      <button class="tool" data-tool="blur" title="Blur (B)" aria-label="Blur">
        <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zM12 4h4v4h-4zM8 8h4v4H8zM16 8h4v4h-4zM4 12h4v4H4zM12 12h4v4h-4zM8 16h4v4H8zM16 16h4v4h-4z" class="filled"/></svg>
      </button>
      <button class="tool" data-tool="crop" title="Crop (C)" aria-label="Crop">
        <svg viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 0 0 2 2h14M2 6h14a2 2 0 0 1 2 2v14"/></svg>
      </button>
    </div>

    <div class="styles" id="styles">
      <div class="swatches" role="radiogroup" aria-label="Color">
        <button class="swatch" data-color="#e53935" style="--c:#e53935" aria-label="Red"></button>
        <button class="swatch" data-color="#fb8c00" style="--c:#fb8c00" aria-label="Orange"></button>
        <button class="swatch" data-color="#fdd835" style="--c:#fdd835" aria-label="Yellow"></button>
        <button class="swatch" data-color="#43a047" style="--c:#43a047" aria-label="Green"></button>
        <button class="swatch" data-color="#1e88e5" style="--c:#1e88e5" aria-label="Blue"></button>
        <button class="swatch" data-color="#8e24aa" style="--c:#8e24aa" aria-label="Purple"></button>
        <button class="swatch" data-color="#000000" style="--c:#000000" aria-label="Black"></button>
        <button class="swatch" data-color="#ffffff" style="--c:#ffffff" aria-label="White"></button>
        <label class="custom-color" title="Custom color">
          <input type="color" id="color" value="#e53935" aria-label="Custom color">
        </label>
      </div>

      <label class="ctl" data-for="stroke">
        <span id="width-label">Size</span>
        <input type="range" id="width" min="1" max="24" value="4">
        <output id="width-value">4</output>
      </label>

      <label class="ctl" data-for="fill">
        Fill
        <select id="fill">
          <option value="none">None</option>
          <option value="light">Light</option>
          <option value="solid">Solid</option>
        </select>
      </label>

      <div class="ctl" data-for="text">
        <select id="font" aria-label="Font"></select>
        <input type="number" id="font-size" min="8" max="200" value="28" aria-label="Font size" title="Font size">
        <button id="bold" class="toggle" title="Bold (Ctrl+B)" aria-label="Bold" aria-pressed="true"><b>B</b></button>
        <button id="italic" class="toggle" title="Italic (Ctrl+I)" aria-label="Italic" aria-pressed="false"><i>I</i></button>
        <button id="text-bg" class="toggle" title="Background behind text" aria-pressed="false">Box</button>
      </div>

      <button id="delete" class="icon" title="Delete (Del)" aria-label="Delete selected" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
      </button>
    </div>

    <div class="cropbar" id="cropbar" hidden>
      <span id="crop-size"></span>
      <button id="crop-cancel">Cancel</button>
      <button id="crop-apply" class="primary">Apply crop</button>
    </div>
  </div>

  <div id="notice" class="notice" hidden></div>

  <main id="stage">
    <div id="paper">
      <canvas id="canvas"></canvas>
      <textarea id="text-input" spellcheck="false" hidden></textarea>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button id="toast-show">Show in folder</button>
  </div>

  <script type="module" src="editor.js"></script>
</body>
</html>
